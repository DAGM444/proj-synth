services:
  # ==========================================
  # Database Service (PostgreSQL)
  # Persistent database storage for Prisma
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: proj-synth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthpassword}
      POSTGRES_DB: ${POSTGRES_DB:-synthdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synth} -d ${POSTGRES_DB:-synthdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================
  # Backend API Service (Node.js Express + Prisma)
  # Multi-stage container with Python3, ffmpeg & yt-dlp
  # ==========================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: proj-synth-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-file:./dev.db}
      JWT_SECRET: ${JWT_SECRET:-proj-synth-secret-jwt-key-2026}
      CLIENT_URL: ${CLIENT_URL:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173}
    volumes:
      # Persistent storage for SQLite database and Prisma schema
      - backend_data:/app/prisma
      # Volume mapping for logs and cached media
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # Frontend Client Service (React Vite + Nginx)
  # Multi-stage container serving static assets & reverse proxying /api
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: proj-synth-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    name: proj-synth-postgres-data
  backend_data:
    name: proj-synth-backend-data
  backend_logs:
    name: proj-synth-backend-logs
